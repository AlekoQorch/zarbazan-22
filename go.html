<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>კავშირები</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans Georgian", sans-serif;
      background: #f2f2f7;
      color: #111;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.06);
      max-width: 420px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.03em; }
    p { margin: 0; color: #8e8e93; font-size: 15px; line-height: 1.45; }
    .spin {
      width: 28px; height: 28px; margin: 18px auto 0;
      border-radius: 50%; border: 2.5px solid rgba(120,120,128,0.2);
      border-top-color: #007aff; animation: s .7s linear infinite;
    }
    a { color: #007aff; font-weight: 600; text-decoration: none; word-break: break-all; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1>კავშირები</h1>
    <p id="msg">ცოცხალ ლინკზე გადაგიყვანთ…</p>
    <div class="spin" id="spin"></div>
    <p id="fallback" style="display:none;margin-top:14px"></p>
  </div>
  <script>
    (async () => {
      const msg = document.getElementById("msg");
      const spin = document.getElementById("spin");
      const fallback = document.getElementById("fallback");
      const t = Date.now();
      const sources = [
        "https://cdn.jsdelivr.net/gh/AlekoQorch/zarbazan-22@main/public-url.txt?t=" + t,
        "https://raw.githubusercontent.com/AlekoQorch/zarbazan-22/main/public-url.txt?t=" + t
      ];
      let live = "";
      for (const urlFile of sources) {
        try {
          const res = await fetch(urlFile, { cache: "no-store" });
          if (!res.ok) continue;
          const text = (await res.text()).trim().split(/\s+/)[0];
          if (/^https:\/\//.test(text)) { live = text; break; }
        } catch (_) {}
      }
      if (!live) {
        spin.style.display = "none";
        msg.textContent = "ცოცხალი ლინკი ამ წუთას მიუწვდომელია.";
        fallback.style.display = "block";
        fallback.innerHTML = 'განაახლე გვერდი, ან გახსენი<br><a href="https://github.com/AlekoQorch/zarbazan-22">GitHub რეპო</a>';
        return;
      }
      msg.textContent = "იხსნება…";
      location.replace(live);
    })();
  </script>
</body>
</html>
