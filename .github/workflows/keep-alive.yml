name: Keep public tunnel alive

on:
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.py"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "people-index.json"
      - "data.json"
      - ".github/workflows/keep-alive.yml"

concurrency:
  group: kavshirebi-tunnel
  cancel-in-progress: true

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start site server
        run: |
          python3 server.py > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/ >/dev/null && exit 0
            sleep 1
          done
          echo "server failed"; cat server.log || true; exit 1

      - name: Install cloudflared
        run: |
          curl -sL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64" -o cloudflared
          chmod +x cloudflared

      - name: Publish tunnel URL and keep alive
        env:
          GIT_AUTHOR_NAME: kavshirebi-bot
          GIT_AUTHOR_EMAIL: bot@users.noreply.github.com
          GIT_COMMITTER_NAME: kavshirebi-bot
          GIT_COMMITTER_EMAIL: bot@users.noreply.github.com
        run: |
          set -e

          start_tunnel() {
            ./cloudflared tunnel --url http://127.0.0.1:8765 > cf.log 2>&1 &
            echo $! > cf.pid
            URL=""
            for i in $(seq 1 60); do
              URL=$(grep -aoE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log 2>/dev/null | head -1 || true)
              if [ -n "$URL" ]; then break; fi
              sleep 1
            done
            if [ -z "$URL" ]; then
              echo "Tunnel URL not found"
              cat cf.log || true
              return 1
            fi
            echo "Candidate URL: $URL"
            ok=0
            for i in $(seq 1 40); do
              if curl -sf --max-time 20 "$URL/" >/dev/null; then
                ok=1
                break
              fi
              sleep 3
            done
            if [ "$ok" != "1" ]; then
              echo "URL never became healthy: $URL"
              return 1
            fi
            echo "$URL" > /tmp/live.url
            echo "Healthy URL: $URL"
            return 0
          }

          publish_url() {
            URL=$(cat /tmp/live.url)
            echo "$URL" > public-url.txt
            git add public-url.txt
            if ! git diff --cached --quiet; then
              git commit -m "chore: update public tunnel URL"
              git pull --rebase origin main || true
              git push origin HEAD:main || true
            fi
          }

          start_tunnel
          publish_url
          URL=$(cat /tmp/live.url)

          end=$((SECONDS + 320*60))
          fail=0
          while [ $SECONDS -lt $end ]; do
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "server died"; exit 1
            fi
            if ! kill -0 "$(cat cf.pid)" 2>/dev/null; then
              echo "cloudflared process died; restarting"
              start_tunnel
              publish_url
              URL=$(cat /tmp/live.url)
              fail=0
              continue
            fi
            if curl -sf --max-time 25 "$URL/" >/dev/null; then
              fail=0
            else
              fail=$((fail + 1))
              echo "health miss $fail for $URL"
              if [ "$fail" -ge 3 ]; then
                echo "restarting unhealthy tunnel"
                kill "$(cat cf.pid)" 2>/dev/null || true
                sleep 2
                start_tunnel
                publish_url
                URL=$(cat /tmp/live.url)
                fail=0
              fi
            fi
            sleep 40
          done
